<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a959"/>
      <stop offset="100%" style="stop-color:#d4b86a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  
  <!-- Decorative Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Inner Decorative Circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#c9a959" stroke-width="1" opacity="0.5"/>
  
  <!-- Main Icon - Stylized H Letter with Wings -->
  <g transform="translate(100, 100)">
    <!-- Left Wing -->
    <path d="M-50,0 Q-60,-20 -40,-30 L-20,-30 Q-35,-20 -30,0 Z" fill="url(#goldGrad)"/>
    
    <!-- Right Wing -->
    <path d="M50,0 Q60,-20 40,-30 L20,-30 Q35,-20 30,0 Z" fill="url(#goldGrad)"/>
    
    <!-- H Letter - Left Vertical -->
    <rect x="-25" y="-40" width="10" height="80" rx="2" fill="url(#goldGrad)"/>
    
    <!-- H Letter - Right Vertical -->
    <rect x="15" y="-40" width="10" height="80" rx="2" fill="url(#goldGrad)"/>
    
    <!-- H Letter - Horizontal Bar -->
    <rect x="-25" y="-5" width="50" height="10" rx="2" fill="url(#goldGrad)"/>
    
    <!-- T Letter Overlay -->
    <rect x="-15" y="-40" width="30" height="10" rx="2" fill="#1a2a4a"/>
    <rect x="-5" y="-40" width="10" height="45" rx="2" fill="#1a2a4a"/>
    
    <!-- Decorative Stars -->
    <polygon points="-55,-45 -53,-40 -48,-40 -52,-36 -50,-31 -55,-35 -60,-31 -58,-36 -62,-40 -57,-40" fill="#c9a959" opacity="0.8"/>
    <polygon points="55,-45 57,-40 62,-40 58,-36 60,-31 55,-35 50,-31 52,-36 48,-40 53,-40" fill="#c9a959" opacity="0.8"/>
  </g>
  
  <!-- Bottom Accent Line -->
  <path d="M40,170 Q100,180 160,170" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Top Decorative Elements -->
  <circle cx="100" cy="18" r="5" fill="url(#goldGrad)"/>
  <line x1="80" y1="18" x2="65" y2="18" stroke="#c9a959" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="18" x2="135" y2="18" stroke="#c9a959" stroke-width="2" stroke-linecap="round"/>
</svg>
